<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>SEEDANCE COMMERCE LAB — 나만의 광고 만들기</title>
  <meta name="description" content="광고 무드와 키워드로 AI가 만드는 나만의 광고 키비주얼과 숏폼 광고 영상. Seedance Seoul Commerce Lab.">
  <!--OG-->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <div class="top-left">
      <button class="top-back" id="topBack" type="button" hidden aria-label="이전 단계로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>이전</button>
      <a class="brand" href="/" data-action="home" aria-label="처음으로">
        <span class="brand-mark">Seedance</span><span class="brand-sub">@ SEOUL</span>
      </a>
    </div>
    <div class="top-right">
      <span class="mode-badge" id="modeBadge" hidden>데모 모드</span>
      <span class="step-count" id="stepCount"></span>
    </div>
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
  </header>

  <div class="net-banner" id="netBanner" role="status" hidden>연결이 불안정해요. 자동으로 다시 시도하는 중…</div>

  <main id="app" class="app" aria-live="polite">
    <section class="boot"><div class="spinner"></div></section>
  </main>

  <footer class="foot">
    <span>Seed · Seedream · Seedance - Powered by BytePlus</span>
  </footer>

  <!-- Step transition: an order-tracking card that advances one stop per step -->
  <div class="slate-wrap" id="slate" hidden aria-hidden="true">
    <div class="track-card">
      <div class="tc-head"><span>SEEDANCE COMMERCE LAB</span><span>배송 조회</span></div>
      <div class="tc-now"><small id="slScene">STEP 01</small><b id="slTitle"></b><span id="slSub"></span></div>
      <div class="tc-line">
        <i class="tc-fill"></i>
        <span class="tc-parcel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8M7.5 5.5l9 5"/></svg></span>
      </div>
      <div class="tc-stops" id="slStops"></div>
      <div class="tc-foot"><span>기획 <b id="slDir">나</b></span><span id="slDate"></span></div>
      <div class="slate-action">주문 완료!</div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
