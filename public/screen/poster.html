<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOW SHOWING — Seedance Cinema Lab 포스터 스크린</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/screen/screen.css">
  <style>
    /* One portrait 9:16 panel: the poster fills it edge to edge. */
    body { background: #000; }
    .canvas { background: #070405; }
    .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; }
    .scene.on { opacity: 1; }

    /* ── poster on show ── */
    .layer { position: absolute; inset: 0; overflow: hidden; transition: opacity 1.2s ease; }
    .layer.out { opacity: 0; }
    .layer img { width: 100%; height: 100%; object-fit: cover; animation: kb var(--hold, 10s) ease-in-out both; }
    @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.06) translateY(-1%); } }
    .layer .sheen { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, transparent 26%, transparent 64%, rgba(255,255,255,.05) 76%, transparent 84%); }
    .new-tag { position: absolute; z-index: 3; top: calc(var(--u) * 2.2); right: calc(var(--u) * 2.2); font-family: var(--display); font-size: calc(var(--u) * 2.6); letter-spacing: .08em; line-height: 1;
      background: var(--accent); color: #0b0d02; padding: calc(var(--u) * .7) calc(var(--u) * 1.3) calc(var(--u) * .4); transform: rotate(5deg); box-shadow: 0 0 calc(var(--u) * 3) rgba(212,255,58,.55); }
    .hold { position: absolute; z-index: 4; left: 0; top: 0; height: calc(var(--u) * .35); width: 0; background: var(--accent); opacity: .7; }
    .hold.run { animation: hold var(--hold, 10s) linear forwards; }
    @keyframes hold { to { width: 100%; } }

    /* ── call to action (idle, and between posters) ── */
    .cta { display: grid; grid-template-rows: auto 1fr auto; text-align: center; padding: calc(var(--u) * 6) calc(var(--u) * 4) calc(var(--u) * 5);
      background: radial-gradient(ellipse 90% 50% at 50% 42%, rgba(150,30,34,.5), transparent 72%), repeating-linear-gradient(90deg, #130708 0 calc(var(--u) * 4), #0d0506 calc(var(--u) * 4) calc(var(--u) * 4.15)), #0a0506; }
    .marquee { position: relative; justify-self: center; padding: calc(var(--u) * 2.2) calc(var(--u) * 3.6) calc(var(--u) * 2.4); border-radius: calc(var(--u) * 1.2);
      background: linear-gradient(#1a0d06, #0c0604); box-shadow: 0 0 0 calc(var(--u) * .35) #3a2410, 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(255,170,60,.2); }
    .marquee h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 7.6); line-height: .95; letter-spacing: .06em; color: #fff6df;
      text-shadow: 0 0 calc(var(--u) * 1) rgba(255,200,120,.9), 0 0 calc(var(--u) * 4) rgba(255,150,40,.55); }
    .marquee p { margin: calc(var(--u) * .5) 0 0; font-family: var(--mono); font-size: calc(var(--u) * 1.3); letter-spacing: .36em; color: #e9c58e; }
    .bulbs { position: absolute; inset: calc(var(--u) * .6); pointer-events: none; border-radius: calc(var(--u) * .8);
      background:
        radial-gradient(circle, #ffe7a8 0 28%, rgba(255,190,90,.5) 40%, transparent 62%) 0 0 / calc(var(--u) * 2.2) calc(var(--u) * 2.2) repeat-x,
        radial-gradient(circle, #ffe7a8 0 28%, rgba(255,190,90,.5) 40%, transparent 62%) 0 100% / calc(var(--u) * 2.2) calc(var(--u) * 2.2) repeat-x,
        radial-gradient(circle, #ffe7a8 0 28%, rgba(255,190,90,.5) 40%, transparent 62%) 0 0 / calc(var(--u) * 2.2) calc(var(--u) * 2.2) repeat-y,
        radial-gradient(circle, #ffe7a8 0 28%, rgba(255,190,90,.5) 40%, transparent 62%) 100% 0 / calc(var(--u) * 2.2) calc(var(--u) * 2.2) repeat-y;
      animation: chase 1.1s steps(2) infinite; }
    .bulbs.b2 { animation-delay: -.55s; filter: brightness(.45); background-position: calc(var(--u) * 1.1) 0, calc(var(--u) * 1.1) 100%, 0 calc(var(--u) * 1.1), 100% calc(var(--u) * 1.1); }
    @keyframes chase { 50% { filter: brightness(.45); } }
    .cta .mid { align-self: center; display: grid; gap: calc(var(--u) * 3.2); }
    .frame { justify-self: center; width: calc(var(--u) * 22); aspect-ratio: 9 / 16; display: grid; place-content: center; gap: calc(var(--u) * 1);
      border: calc(var(--u) * .3) dashed rgba(255,236,200,.35); border-radius: calc(var(--u) * .6); background: rgba(0,0,0,.35); }
    .frame b { font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 5.2); line-height: .9; letter-spacing: .06em; color: #e9dcc6; }
    .frame span { font-family: var(--mono); font-size: calc(var(--u) * 1.1); letter-spacing: .2em; color: var(--muted); }
    .cta h2 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 4.4); line-height: 1.2; word-break: keep-all; color: var(--ink); }
    .cta h2 em { font-style: normal; color: var(--accent); }
    .steps { display: flex; justify-content: center; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 1.6); font-weight: 700; color: #e6dccb; }
    .steps span { padding: calc(var(--u) * .7) calc(var(--u) * 1.3); border-radius: 99px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.3); white-space: nowrap; }
    .steps i { font-style: normal; font-family: var(--mono); color: var(--accent); margin-right: calc(var(--u) * .5); }
    .scan { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.6); font-size: calc(var(--u) * 2.4); font-weight: 900; color: var(--ink); }
    .scan .arr { font-family: var(--display); font-size: calc(var(--u) * 5); line-height: 1; color: var(--accent); animation: nudge 1.2s ease-in-out infinite; }
    /* arrow points at the QR stand: → by default, ← with ?qr=left */
    .qr-left .scan { flex-direction: row-reverse; }
    .qr-left .scan .arr { animation-name: nudge-l; }
    @keyframes nudge { 50% { transform: translateX(calc(var(--u) * 1.2)); } }
    @keyframes nudge-l { 50% { transform: translateX(calc(var(--u) * -1.2)); } }
    .count { margin-top: calc(var(--u) * 1.6); font-family: var(--mono); font-size: calc(var(--u) * 1.3); letter-spacing: .24em; color: var(--muted); }
    .count b { color: var(--ink); font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 2.6); letter-spacing: .04em; margin: 0 calc(var(--u) * .4); }

    /* ── premiere takeover (new submission) ── */
    .premiere { z-index: 10; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; padding: calc(var(--u) * 5.5) calc(var(--u) * 4) calc(var(--u) * 4.5);
      background: radial-gradient(ellipse 80% 45% at 50% 48%, rgba(var(--g), .35), transparent 72%), #040203; transition: opacity .8s ease; }
    .premiere .eyebrow { font-family: var(--mono); font-size: calc(var(--u) * 1.4); letter-spacing: .4em; color: var(--accent); }
    .premiere .wp { font-family: var(--display); font-size: calc(var(--u) * 8.6); line-height: .9; letter-spacing: .03em; margin-top: calc(var(--u) * .8);
      background: linear-gradient(180deg, #fff, #d9c9a8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .premiere .head { transform: translateY(calc(var(--u) * -2)); opacity: 0; transition: all 1s cubic-bezier(.2,.8,.2,1) .3s; }
    .premiere .pic { position: relative; align-self: center; height: calc(var(--u) * 56); aspect-ratio: 9 / 16; }
    .premiere .pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px;
      box-shadow: 0 0 calc(var(--u) * 8) rgba(var(--g), .5), 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.85);
      transform: scale(.82) rotate(-2deg); opacity: 0; transition: all 1.3s cubic-bezier(.2,.8,.2,1) .2s; }
    .premiere .shine { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 3px; }
    .premiere .shine::after { content: ''; position: absolute; inset: -10%; mix-blend-mode: screen;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.24) 50%, transparent 60%); transform: translateX(-110%); }
    .premiere .by { transform: translateY(calc(var(--u) * 2)); opacity: 0; transition: all 1s cubic-bezier(.2,.8,.2,1) .8s; }
    .premiere .by h2 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 4.6); line-height: 1.1; word-break: keep-all; }
    .premiere .by p { margin: calc(var(--u) * 1) 0 0; font-family: var(--mono); font-size: calc(var(--u) * 1.4); letter-spacing: .24em; color: var(--muted); }
    .premiere .by p b { font-family: var(--kr); font-weight: 400; letter-spacing: 0; font-size: calc(var(--u) * 2.8); color: var(--ink); margin-left: calc(var(--u) * .6); }
    .premiere.on .head, .premiere.on .by { transform: none; opacity: 1; }
    .premiere.on .pic img { transform: none; opacity: 1; }
    .premiere.on .shine::after { animation: sweep 2.4s ease-in-out 1.2s; }
    @keyframes sweep { to { transform: translateX(110%); } }
    .flash { position: absolute; inset: 0; z-index: 20; background: #fff; opacity: 0; pointer-events: none; }
    .flash.go { animation: flash .9s ease-out; }
    @keyframes flash { 8% { opacity: .55; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="canvas" id="canvas">
    <section class="scene" id="sPoster"></section>
    <div class="hold" id="hold"></div>

    <section class="scene cta on" id="sCta">
      <div class="marquee"><div class="bulbs"></div><div class="bulbs b2"></div><h1>NOW SHOWING</h1><p>SEEDANCE CINEMA LAB · SEOUL</p></div>
      <div class="mid">
        <div class="frame"><b>YOUR<br>POSTER<br>HERE</b><span>9:16 · SEEDREAM</span></div>
        <h2>다음 포스터의 감독은<br><em>바로 당신</em>입니다</h2>
        <div class="steps"><span><i>01</i>장르</span><span><i>02</i>키워드</span><span><i>03</i>포스터</span><span><i>04</i>예고편</span></div>
      </div>
      <div>
        <div class="scan"><span>QR을 스캔하고 시작하세요</span><span class="arr" aria-hidden="true">→</span></div>
        <div class="count">PREMIERES TODAY<b id="count">0</b></div>
      </div>
    </section>

    <section class="scene premiere" id="sPremiere" aria-live="polite">
      <div class="head"><div class="eyebrow">JUST SUBMITTED · 방금 도착한 신작</div><div class="wp">WORLD PREMIERE</div></div>
      <div class="pic"><img id="pImg" alt=""><span class="shine"></span></div>
      <div class="by"><h2 id="pTitle"></h2><p>A FILM BY<b id="pDir"></b></p></div>
    </section>
    <div class="flash" id="flash"></div>
  </div>

  <script type="module">
    import { $, esc, sleep, watchFeed, screenChrome, preload } from '/screen/screen.js';

    const chrome = screenChrome();
    // The QR stand sits to the right of the poster screen; ?qr=left flips the arrow.
    const qrSide = new URLSearchParams(location.search).get('qr') === 'left' ? 'left' : 'right';
    document.body.classList.add(`qr-${qrSide}`);
    if (qrSide === 'left') $('.scan .arr').textContent = '←';

    const HOLD_MS = 10000;      // each poster stays up this long
    const PREMIERE_MS = 9000;   // takeover for a brand-new poster
    const CTA_MS = 7000;        // call-to-action card between posters
    const CTA_EVERY = 5;        // …after this many posters
    $('#canvas').style.setProperty('--hold', `${HOLD_MS / 1000}s`);

    let items = [];             // newest first
    let known = null;           // ids already seen (null = first load)
    const fresh = [];           // new submissions waiting for their premiere
    const newIds = new Set();   // tagged NEW for a while
    let cursor = 0;
    let shownSinceCta = 0;

    const hexRgb = (h) => { const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})/i.exec(h || ''); return m ? m.slice(1).map((x) => parseInt(x, 16)).join(',') : '255,240,210'; };
    const show = (id) => document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('on', s.id === id));
    const alive = (it) => items.some((x) => x.id === it.id);

    function hold(on) {
      const h = $('#hold');
      h.classList.remove('run');
      if (on) { void h.offsetWidth; h.classList.add('run'); }
    }

    function putPoster(it) {
      const stage = $('#sPoster');
      const old = [...stage.querySelectorAll('.layer')];
      const layer = document.createElement('div');
      layer.className = 'layer out';
      layer.innerHTML = `<img src="${esc(it.poster)}" alt="${esc(it.title)}"><div class="sheen"></div>${newIds.has(it.id) ? '<div class="new-tag">NEW</div>' : ''}`;
      stage.append(layer);
      void layer.offsetWidth; // commit the hidden state so the fade-in runs
      layer.classList.remove('out');
      old.forEach((o) => { o.classList.add('out'); setTimeout(() => o.remove(), 1400); });
      show('sPoster');
    }

    function nextItem() {
      while (fresh.length) { const f = fresh.shift(); if (alive(f)) return { it: f, premiere: true }; }
      if (!items.length) return null;
      const it = items[cursor % items.length];
      cursor++;
      return { it, premiere: false };
    }

    // Wait up to ms, but cut short when a premiere arrives or the shown poster is hidden by staff.
    async function waitFor(ms, it) {
      const end = Date.now() + ms;
      while (Date.now() < end) {
        if (fresh.some(alive)) return;
        if (it && !alive(it)) return;
        await sleep(250);
      }
    }

    async function premiere(it) {
      hold(false);
      await preload(it.poster);
      const p = $('#sPremiere');
      p.style.setProperty('--g', hexRgb(it.genre?.color));
      $('#pTitle').textContent = `〈${it.title}〉`;
      $('#pDir').textContent = `${it.director} 감독`;
      $('#pImg').src = it.poster;
      $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
      show('sPremiere');
      await sleep(PREMIERE_MS);
      cursor = 0; // carry on from the newest
    }

    (async function program() {
      for (;;) {
        const n = nextItem();
        if (!n) { hold(false); show('sCta'); await sleep(1000); continue; }
        if (n.premiere) await premiere(n.it);
        if (!alive(n.it)) continue;
        await preload(n.it.poster);
        putPoster(n.it);
        hold(true);
        await waitFor(HOLD_MS, n.it);
        if (++shownSinceCta >= CTA_EVERY && !fresh.some(alive)) {
          shownSinceCta = 0;
          hold(false);
          show('sCta');
          await waitFor(CTA_MS);
        }
        if (chrome.stale() && !fresh.length) location.reload();
      }
    })();

    watchFeed('poster', (list) => {
      if (known) {
        for (const it of [...list].reverse()) if (!known.has(it.id)) { fresh.push(it); newIds.add(it.id); setTimeout(() => newIds.delete(it.id), 10 * 60000); }
      }
      known = new Set([...(known || []), ...list.map((x) => x.id)]);
      items = list;
      $('#count').textContent = items.length;
    });
  </script>
</body>
</html>
