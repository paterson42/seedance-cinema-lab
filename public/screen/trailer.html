<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>광고 영상 스크린 (For You 피드) — Seedance Commerce Lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/screen/screen.css">
  <style>
    /* One portrait 9:16 panel that plays the finished ads inside the For You feed.
       Follows the TikTok Product Marketing Style Guide ("The For You Feed"):
       - Minimum UI, the mode for out-of-home / immersive content: top bar, sidebar, name and caption.
         No device frame, no notch, no system UI (clock, battery), no bottom navigation.
       - "For You" (추천) is the selected tab.
       - The UI is not stylised or recoloured: white UI, nothing covering its icons or text.
       - This screen is only a player: no call to action or other message on top of the feed.
       - UI is sized for a large display seen from a distance, lighter than phone proportions.
       Official UI assets and TikTok Sans are picked up from /brand/tiktok-ui/ when the files are there
       (see public/brand/README.md); until then neutral placeholder icons are shown. */
    @font-face { font-family: 'TikTok Sans'; src: url('/brand/tiktok-ui/TikTokSans-Regular.woff2') format('woff2'); font-weight: 400 500; font-display: swap; }
    @font-face { font-family: 'TikTok Sans'; src: url('/brand/tiktok-ui/TikTokSans-Bold.woff2') format('woff2'); font-weight: 600 900; font-display: swap; }
    body { background: #000; }
    .canvas { background: #000; font-family: 'TikTok Sans', var(--sans); }

    /* ── video slides (two layers, swiped vertically) ── */
    .slide { position: absolute; inset: 0; transform: translateY(100%); transition: transform .7s cubic-bezier(.3, .9, .25, 1); background: #000; }
    .slide.on { transform: none; }
    .slide.out { transform: translateY(-100%); }
    .slide.jump { transition: none; }
    .slide video, .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .slide img { filter: none; }
    .shade { position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: linear-gradient(180deg, rgba(0,0,0,.4) 0, transparent 12%, transparent 72%, rgba(0,0,0,.6) 100%); }

    /* ── top bar: LIVE · tabs (For You selected) · search ── */
    .top { position: absolute; z-index: 20; left: 0; right: 0; top: calc(var(--u) * 1); height: calc(var(--u) * 5.6); display: flex; align-items: center; justify-content: space-between;
      padding: 0 calc(var(--u) * 2.6); color: #fff; }
    .top .ico { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); display: grid; place-items: center; }
    .top .ico img, .top .ico svg { width: 100%; height: 100%; object-fit: contain; }
    .tabs { display: flex; gap: calc(var(--u) * 1.9); font-size: calc(var(--u) * 1.55); font-weight: 600; color: rgba(255,255,255,.6); }
    .tabs b { position: relative; color: #fff; font-weight: 700; }
    .tabs b::after { content: ''; position: absolute; left: 25%; right: 25%; bottom: calc(var(--u) * -.7); height: calc(var(--u) * .24); border-radius: 99px; background: #fff; }

    /* ── right action rail ── */
    .rail { position: absolute; z-index: 20; right: calc(var(--u) * 1.6); bottom: calc(var(--u) * 4.2); width: calc(var(--u) * 6); display: grid; justify-items: center; gap: calc(var(--u) * 1.9);
      color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
    .avatar { position: relative; width: calc(var(--u) * 4.8); height: calc(var(--u) * 4.8); border-radius: 50%; border: calc(var(--u) * .2) solid #fff; display: grid; place-items: center;
      background: #2a2a2e; color: #fff; font-weight: 700; font-size: calc(var(--u) * 2.1); margin-bottom: calc(var(--u) * .9); }
    .avatar::after { content: '+'; position: absolute; left: 50%; bottom: calc(var(--u) * -1); transform: translateX(-50%); width: calc(var(--u) * 1.9); height: calc(var(--u) * 1.9); border-radius: 50%;
      background: #fe2c55; color: #fff; font: 900 calc(var(--u) * 1.5) / calc(var(--u) * 1.85) var(--sans); text-align: center; }
    .act { display: grid; justify-items: center; gap: calc(var(--u) * .3); font-size: calc(var(--u) * 1.15); font-weight: 600; }
    .act svg { width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); filter: drop-shadow(0 1px 5px rgba(0,0,0,.55)); }
    .act img { width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); object-fit: contain; }
    .act.like.liked svg { color: #fe2c55; }
    .act.like.pop svg { animation: pop .34s ease-out; }
    @keyframes pop { 40% { transform: scale(1.28); } }
    .disc { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 50%; margin-top: calc(var(--u) * .4); animation: spin 5s linear infinite;
      background: radial-gradient(circle, #8a8a90 0 26%, #111 27% 34%, #2a2a2e 35% 62%, #111 63%); border: calc(var(--u) * .3) solid #2a2a2e; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── floating hearts ── */
    .hearts { position: absolute; z-index: 19; right: calc(var(--u) * 7.2); bottom: calc(var(--u) * 35); width: calc(var(--u) * 12); height: calc(var(--u) * 46); pointer-events: none; overflow: visible; }
    .hearts svg { position: absolute; right: 0; bottom: 0; width: var(--s, calc(var(--u) * 3.6)); height: var(--s, calc(var(--u) * 3.6)); opacity: 0;
      animation: float var(--d, 3s) cubic-bezier(.3, .6, .4, 1) forwards; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
    @keyframes float {
      0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0deg); }
      12% { opacity: 1; transform: translate(calc(var(--x) * .2), -8%) scale(1) rotate(calc(var(--r) * .3)); }
      70% { opacity: .9; }
      100% { opacity: 0; transform: translate(var(--x), calc(var(--u) * -44)) scale(1.15) rotate(var(--r)); }
    }

    /* ── caption block (bottom-left) ── */
    .cap { position: absolute; z-index: 20; left: calc(var(--u) * 2.4); right: calc(var(--u) * 10.5); bottom: calc(var(--u) * 4.2); color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.7);
      transition: opacity .3s ease; }
    .cap.swap { opacity: 0; }
    .handle { font-size: calc(var(--u) * 1.75); font-weight: 700; }
    .text { margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1.5); line-height: 1.45; font-weight: 400; word-break: keep-all;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .text b { font-weight: 700; }
    /* ── playback progress (hairline at the very bottom) ── */
    .prog { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; height: calc(var(--u) * .25); background: rgba(255,255,255,.2); }
    .prog i { display: block; height: 100%; width: 0; background: #fff; }

    /* ── idle (no ads yet) ── */
    .idle { position: absolute; z-index: 15; inset: 0; display: grid; place-content: center; text-align: center; gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 6);
      background: radial-gradient(ellipse at 50% 42%, #171a22, #000 72%); transition: opacity .5s ease; }
    .idle[hidden] { display: none; }
    .idle b { font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 6.2); line-height: 1.15; color: #fff; }
    .idle span { font-size: calc(var(--u) * 2.1); color: rgba(255,255,255,.7); line-height: 1.6; word-break: keep-all; }
    .canvas.empty .rail, .canvas.empty .cap, .canvas.empty .hearts, .canvas.empty .prog { visibility: hidden; }
  </style>
</head>
<body>
  <div class="canvas empty" id="feed">
    <div class="slide" id="sA"><img alt=""><video muted playsinline preload="auto"></video></div>
    <div class="slide" id="sB"><img alt=""><video muted playsinline preload="auto"></video></div>
    <div class="shade"></div>

    <div class="idle" id="idle">
      <b>첫 번째 광고를<br>기다리는 중</b>
    </div>

    <header class="top">
      <!-- Official top-bar icons load from /brand/tiktok-ui/ when present; the slots stay empty otherwise. -->
      <span class="ico"><img data-asset="top-live" alt="" hidden></span>
      <div class="tabs"><span>탐색</span><span>친구</span><span>팔로잉</span><b>추천</b></div>
      <span class="ico"><img data-asset="top-search" alt="" hidden></span>
    </header>

    <aside class="rail" aria-hidden="true">
      <div class="avatar" id="avatar"></div>
      <div class="act like" id="like"><img data-asset="like" alt="" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.300 2.200 4.500 5.800 4.500c2 0 3.400 1 4.200 2.300h4c.8-1.300 2.200-2.300 4.200-2.300 3.600 0 5.500 3.800 3.800 7.200C19.500 16.400 12 21 12 21z"/></svg><span id="nLike">0</span></div>
      <div class="act"><img data-asset="comment" alt="" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.500c5 0 9 3.400 9 7.700 0 4.200-4 7.600-9 7.600-.9 0-1.800-.1-2.600-.3L5 20.800l.9-3.700C4.100 15.700 3 13.600 3 11.200c0-4.300 4-7.700 9-7.700z"/><circle cx="8.300" cy="11.300" r="1.100" fill="#000" opacity=".55"/><circle cx="12" cy="11.300" r="1.100" fill="#000" opacity=".55"/><circle cx="15.700" cy="11.300" r="1.100" fill="#000" opacity=".55"/></svg><span id="nCmt">0</span></div>
      <div class="act"><img data-asset="save" alt="" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.500 3.500h11a1 1 0 0 1 1 1v16l-6.500-4.200-6.500 4.200v-16a1 1 0 0 1 1-1z"/></svg><span id="nSave">0</span></div>
      <div class="act"><img data-asset="share" alt="" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.500 4.500 21.500 12l-8 7.500v-4.600c-5-.3-8.300 1.200-10.500 4.600.3-6 3.500-10.300 10.500-10.800z"/></svg><span id="nShare">0</span></div>
      <div class="disc"></div>
    </aside>
    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <section class="cap" id="cap">
      <div class="handle" id="handle"></div>
      <div class="text" id="text"></div>
    </section>

    <div class="prog"><i id="prog"></i></div>
  </div>

  <script type="module">
    import { $, esc, sleep, watchFeed, screenChrome, preload } from '/screen/screen.js';

    const chrome = screenChrome();
    // Official UI assets: each <img data-asset="name"> tries /brand/tiktok-ui/name.svg then .png.
    // When one loads it replaces the neutral placeholder icon next to it.
    document.querySelectorAll('img[data-asset]').forEach((el) => {
      const tries = ['svg', 'png'].map((x) => `/brand/tiktok-ui/${el.dataset.asset}.${x}`);
      el.onload = () => { el.hidden = false; el.parentElement.querySelector('svg')?.remove(); };
      el.onerror = () => { const next = tries.shift(); if (next) el.src = next; };
      el.src = tries.shift();
    });

    const MAX_VIDEO_MS = 40000, HEART_MS = 520;
    let items = [];          // newest first (live ad videos)
    let known = null;
    const fresh = [];        // newly finished ads jump the rotation
    let rot = 0;
    let current = null;
    let credits = [];        // 제작 / 제공 / 캠페인, from the feed (content.json event.credits)
    let front = $('#sA'), back = $('#sB');

    // Shown on a loop while no visitor ad is live yet: a real ad made with this booth flow.
    // It steps aside as soon as the first visitor ad arrives. Files: public/placeholder/.
    const SAMPLE = { id: 'sample', title: '민트봄봄랜턴', tagline: '벚꽃 봄날의 산책, 반짝이는 친환경 미니 랜턴', director: 'Seedance', seed: 277156,
      poster: '/placeholder/sample-ad.jpg', video: '/placeholder/sample-ad.mp4' };
    let sampleOk = false;
    fetch(SAMPLE.video, { method: 'HEAD' }).then((r) => { sampleOk = r.ok; }).catch(() => {});

    const alive = (it) => (it.id === SAMPLE.id ? !items.length : items.some((x) => x.id === it.id));
    const num = (n) => (n >= 10000 ? `${(n / 10000).toFixed(1)}만` : n.toLocaleString('ko-KR'));

    function pick() {
      while (fresh.length) { const f = fresh.shift(); if (alive(f)) return { it: f, isNew: true }; }
      if (!items.length) return sampleOk ? { it: SAMPLE } : null;
      for (let i = 0; i < items.length; i++) {
        const it = items[rot++ % items.length];
        if (items.length === 1 || it.id !== current?.id) return { it };
      }
      return { it: items[0] };
    }
    const peek = () => fresh.find(alive) || (items.length ? items[rot % items.length] : null);

    // ── hearts ──
    const HEART = '<path d="M12 21s-7.500-4.600-10-9.300C.300 8.300 2.200 4.500 5.800 4.500c2 0 3.400 1 4.200 2.300h4c.8-1.300 2.200-2.300 4.200-2.300 3.600 0 5.500 3.800 3.800 7.200C19.500 16.400 12 21 12 21z"/>';
    let likes = 0;
    function heart() {
      const box = $('#hearts');
      if (box.childElementCount > 22) return;
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('fill', '#fe2c55'); // the app's own like colour only
      s.innerHTML = HEART;
      s.style.setProperty('--x', `calc(var(--u) * ${(Math.random() * -7).toFixed(1)})`); // drift left, clear of the sidebar icons
      s.style.setProperty('--r', `${Math.round(Math.random() * 50 - 25)}deg`);
      s.style.setProperty('--d', `${(2.6 + Math.random() * 1.6).toFixed(2)}s`);
      s.style.setProperty('--s', `calc(var(--u) * ${(2 + Math.random() * 1.7).toFixed(1)})`);
      s.addEventListener('animationend', () => s.remove());
      box.append(s);
      likes += 1 + Math.floor(Math.random() * 7);
      $('#nLike').textContent = num(likes);
      const l = $('#like'); l.classList.add('liked'); l.classList.remove('pop'); void l.offsetWidth; l.classList.add('pop');
    }
    let heartTimer = 0;
    const hearts = (on) => { clearInterval(heartTimer); if (on) heartTimer = setInterval(() => { if (Math.random() < 0.8) heart(); }, HEART_MS); };

    // ── overlays for the ad on screen ──
    function dress(it) {
      const seed = Number(it.seed) || 1;
      $('#avatar').textContent = [...String(it.director || '나')][0];
      $('#like').classList.remove('liked');
      likes = 1200 + (seed % 8800);
      $('#nLike').textContent = num(likes);
      $('#nCmt').textContent = num(20 + (seed % 380));
      $('#nSave').textContent = num(40 + (seed % 900));
      $('#nShare').textContent = num(10 + (seed % 240));
      // Name + caption, as in the feed. Everything about the ad lives in the caption text.
      $('#handle').textContent = it.director || '';
      $('#text').innerHTML = `<b>${esc(it.title)}</b>${it.tagline ? ` — ${esc(it.tagline)}` : ''}<br>`
        + `기획 ${esc(it.director)} · Seedance Tour Seoul by BytePlus`;
    }

    function ready(v) {
      return new Promise((res) => {
        if (v.readyState >= 2) return res();
        const done = () => { v.oncanplay = v.onerror = null; clearTimeout(t); res(); };
        const t = setTimeout(done, 3000);
        v.oncanplay = done; v.onerror = done;
      });
    }
    function playThrough(v) {
      return new Promise((resolve) => {
        let done = false;
        const finish = () => { if (done) return; done = true; clearTimeout(t); v.onended = v.onerror = v.ontimeupdate = null; resolve(); };
        const t = setTimeout(finish, MAX_VIDEO_MS);
        v.onended = finish;
        v.onerror = finish;
        v.ontimeupdate = () => {
          if (current && !alive(current)) { v.pause(); return finish(); } // an operator hid it mid-play
          if (v.duration) $('#prog').style.width = `${(100 * v.currentTime) / v.duration}%`;
        };
        v.play().catch(() => setTimeout(finish, 3000));
      });
    }

    async function feature({ it, isNew }) {
      const first = !current;
      current = it;
      // load the next ad on the hidden slide, then swipe it up
      const img = $('img', back), vid = $('video', back);
      img.src = it.poster || '';
      vid.src = it.video;
      vid.currentTime = 0;
      await Promise.all([ready(vid), preload(it.poster)]);
      back.classList.add('jump'); back.classList.remove('out', 'on'); void back.offsetWidth; back.classList.remove('jump');
      $('#cap').classList.add('swap');
      hearts(false);
      front.classList.remove('on'); front.classList.add('out');
      back.classList.add('on');
      [front, back] = [back, front];
      await sleep(first ? 50 : 380);
      $('#feed').classList.remove('empty');
      $('#idle').hidden = true;
      dress(it);
      $('#prog').style.width = '0';
      $('#cap').classList.remove('swap');
      hearts(true);
      const old = $('video', back); old.pause(); // the slide that just left
      await playThrough($('video', front));
      // warm up the next ad
      const nx = peek();
      if (nx?.poster) preload(nx.poster);
    }

    (async function program() {
      for (;;) {
        const next = pick();
        if (!next) {
          if (current) { current = null; hearts(false); $('#feed').classList.add('empty'); $('#idle').hidden = false; front.classList.remove('on'); $('video', front).pause(); }
          await sleep(2000);
          continue;
        }
        await feature(next);
        if (chrome.stale()) location.reload();
      }
    })();

    watchFeed('trailer', (list, d) => {
      credits = d?.credits || credits;
      if (known) for (const it of [...list].reverse()) if (!known.has(it.id)) fresh.push(it);
      known = new Set([...(known || []), ...list.map((x) => x.id)]);
      items = list;
    });
  </script>
</body>
</html>
