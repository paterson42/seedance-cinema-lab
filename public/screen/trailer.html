<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCREEN 01 — Seedance Cinema Lab 예고편 스크린</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/screen/screen.css">
  <style>
    /* One portrait 9:16 panel: the 9:16 trailer fills it edge to edge. */
    body { background: #000; }
    .canvas { background: #000; }
    .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
    .scene.on { opacity: 1; }

    /* pre-show card */
    .pre { display: grid; place-items: center; background: radial-gradient(ellipse 80% 50% at 50% 50%, #0c1406, #030402 75%); }
    .pre .card { width: 84%; padding: calc(var(--u) * 4.5) calc(var(--u) * 3); border: calc(var(--u) * .35) solid var(--accent); text-align: center;
      box-shadow: 0 0 calc(var(--u) * 6) rgba(212,255,58,.14), inset 0 0 calc(var(--u) * 6) rgba(212,255,58,.06); }
    .pre small { display: block; font-family: var(--mono); font-size: calc(var(--u) * 1.3); letter-spacing: .36em; color: var(--accent); }
    .pre h3 { margin: calc(var(--u) * 2) 0; font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 5.4); line-height: 1.05; }
    .pre p { margin: 0; font-size: calc(var(--u) * 1.9); color: #cfd3c4; line-height: 1.6; word-break: keep-all; }
    .pre p b { color: var(--ink); }
    .pre .meta { margin-top: calc(var(--u) * 3); display: grid; gap: calc(var(--u) * .6); font-family: var(--mono); font-size: calc(var(--u) * 1.15); letter-spacing: .18em; color: var(--muted); }

    /* the trailer itself */
    .play video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
    .play::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 16%, transparent 72%, rgba(0,0,0,.7)); }
    .play .tagbox { position: absolute; z-index: 3; left: calc(var(--u) * 2.4); top: calc(var(--u) * 2.4); font-family: var(--mono); font-size: calc(var(--u) * 1.2); letter-spacing: .16em; color: rgba(255,255,255,.8); }
    .play .tagbox b { display: inline-block; font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 2.2); letter-spacing: .1em; color: #000; background: var(--g, var(--accent)); padding: calc(var(--u) * .3) calc(var(--u) * .9) 0; margin-right: calc(var(--u) * .8); vertical-align: middle; }
    .play .lower { position: absolute; z-index: 3; left: calc(var(--u) * 2.6); right: calc(var(--u) * 2.6); bottom: calc(var(--u) * 3.4); opacity: 0; transform: translateY(calc(var(--u) * 1.5)); transition: all .9s ease; }
    .play .lower.on { opacity: 1; transform: none; }
    .play .lower small { display: block; font-family: var(--mono); font-size: calc(var(--u) * 1.2); letter-spacing: .3em; color: var(--accent); }
    .play .lower b { display: block; font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 3.4); margin-top: calc(var(--u) * .5); text-shadow: 0 2px 20px #000; }
    .play .prog { position: absolute; z-index: 3; left: 0; bottom: 0; height: calc(var(--u) * .35); width: 0; background: var(--accent); opacity: .8; }

    /* end title card */
    .end { display: grid; grid-template-rows: 1fr auto; justify-items: center; text-align: center; padding: calc(var(--u) * 5) calc(var(--u) * 3.5) calc(var(--u) * 3.5);
      background: radial-gradient(ellipse 80% 45% at 50% 32%, rgba(var(--rgb), .28), transparent 72%), #040404; }
    .end .top { display: grid; justify-items: center; align-content: center; gap: calc(var(--u) * 1.6); }
    .end img { height: calc(var(--u) * 46); aspect-ratio: 9 / 16; object-fit: cover; border-radius: 2px; box-shadow: 0 0 calc(var(--u) * 7) rgba(var(--rgb), .45), 0 calc(var(--u) * 3) calc(var(--u) * 6) #000; }
    .end small { font-family: var(--mono); font-size: calc(var(--u) * 1.3); letter-spacing: .36em; color: var(--muted); }
    .end h2 { margin: 0; font-family: var(--kr); font-weight: 400; font-size: calc(var(--u) * 5.2); line-height: 1.05; word-break: keep-all; }
    .end .tl { margin: 0; font-size: calc(var(--u) * 1.9); color: #d6d0c4; font-weight: 500; word-break: keep-all; }
    .end .billing { padding-top: calc(var(--u) * 1.6); border-top: 1px solid rgba(255,255,255,.14); width: 100%;
      font-family: 'Bebas Neue', var(--sans); font-size: calc(var(--u) * 1.7); letter-spacing: .1em; line-height: 1.45; color: #b8b2a6; }
    .end .billing b { color: var(--ink); font-family: var(--sans); font-weight: 700; letter-spacing: 0; }
    .end .next { margin-top: calc(var(--u) * 1.6); font-family: var(--mono); font-size: calc(var(--u) * 1.2); letter-spacing: .2em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .end .next b { font-family: var(--sans); letter-spacing: 0; color: var(--accent); font-size: calc(var(--u) * 1.7); margin-left: calc(var(--u) * .6); }

    /* ── curtains & valance (closed = idle / between premieres) ── */
    .curtain { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 20; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.55), transparent 12%, transparent 88%, rgba(0,0,0,.55)),
        repeating-linear-gradient(90deg, #5c0710 0, #8e1220 calc(var(--u) * 1.6), #b31c2c calc(var(--u) * 2.3), #8e1220 calc(var(--u) * 3), #4a050c calc(var(--u) * 4.6));
      box-shadow: 0 0 calc(var(--u) * 6) rgba(0,0,0,.9);
      transition: transform 2.2s cubic-bezier(.6,.05,.25,1); }
    .curtain::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,190,150,.12), transparent 30%, transparent 70%, rgba(0,0,0,.6)); }
    .curtain.l { left: 0; transform: translateX(-100%); }
    .curtain.r { right: 0; transform: translateX(100%); }
    .closed .curtain.l, .closed .curtain.r { transform: none; }
    .valance { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 6); z-index: 25; pointer-events: none;
      background: repeating-linear-gradient(90deg, #6d0a15 0, #a3182a calc(var(--u) * 1.6), #6d0a15 calc(var(--u) * 3.2));
      -webkit-mask: radial-gradient(circle calc(var(--u) * 2) at 50% calc(var(--u) * 4), #000 98%, transparent) 0 0 / calc(var(--u) * 4) 100% repeat-x, linear-gradient(#000, #000) 0 0 / 100% calc(var(--u) * 4) no-repeat;
              mask: radial-gradient(circle calc(var(--u) * 2) at 50% calc(var(--u) * 4), #000 98%, transparent) 0 0 / calc(var(--u) * 4) 100% repeat-x, linear-gradient(#000, #000) 0 0 / 100% calc(var(--u) * 4) no-repeat;
      filter: drop-shadow(0 calc(var(--u) * 1) calc(var(--u) * 2) rgba(0,0,0,.8)); transform: translateY(-100%); transition: transform 1.2s ease; }
    .closed .valance { transform: none; }
    .curtain-title { position: absolute; z-index: 30; inset: 0; display: grid; place-content: center; text-align: center; gap: calc(var(--u) * 1.6); pointer-events: none; opacity: 0; transition: opacity .3s; padding: 0 calc(var(--u) * 3); }
    .closed .curtain-title { opacity: 1; transition-delay: 1.4s; }
    .curtain-title small { font-family: var(--mono); font-size: calc(var(--u) * 1.4); letter-spacing: .4em; color: #ffd9a8; }
    .curtain-title b { font-family: var(--display); font-weight: 400; font-size: calc(var(--u) * 9.4); line-height: .88; letter-spacing: .05em; color: #fff3dc;
      text-shadow: 0 0 calc(var(--u) * 2) rgba(255,190,120,.8), 0 0 calc(var(--u) * 6) rgba(255,120,60,.5); }
    .curtain-title span { font-size: calc(var(--u) * 2.3); font-weight: 700; color: #f2d6c0; word-break: keep-all; line-height: 1.45; }
    .curtain-title .scan { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 1.4); margin-top: calc(var(--u) * 2); font-size: calc(var(--u) * 2.2); font-weight: 900; color: #fff3dc; }
    .curtain-title .arr { font-family: var(--display); font-size: calc(var(--u) * 4.6); line-height: 1; color: var(--accent); animation: nudge 1.2s ease-in-out infinite; }
    /* arrow points at the QR stand: ← by default, → with ?qr=right */
    .qr-right .curtain-title .scan { flex-direction: row-reverse; }
    .qr-left .curtain-title .arr { animation-name: nudge-l; }
    @keyframes nudge { 50% { transform: translateX(calc(var(--u) * 1.2)); } }
    @keyframes nudge-l { 50% { transform: translateX(calc(var(--u) * -1.2)); } }
    .curtain-title .count { margin-top: calc(var(--u) * 1); font-family: var(--mono); font-size: calc(var(--u) * 1.2); letter-spacing: .24em; color: #e9c58e; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="canvas closed" id="hall">
    <div class="scene pre" id="sPre"><div class="card">
      <small>THE FOLLOWING PREVIEW</small>
      <h3>다음 예고편</h3>
      <p>이 예고편은 <b id="preDir"></b> 감독이<br>Seedance Cinema Lab 부스에서<br>직접 만들었습니다.</p>
      <div class="meta"><span>ALL AUDIENCES</span><span id="preSeed"></span><span>SEED · SEEDREAM · SEEDANCE</span></div>
    </div></div>
    <div class="scene play" id="sPlay">
      <video id="vid" muted playsinline preload="auto"></video>
      <div class="tagbox" id="playTag"></div>
      <div class="lower" id="playLower"><small>A FILM BY</small><b id="playDir"></b></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="scene end" id="sEnd">
      <div class="top">
        <img id="endImg" alt="">
        <small id="endGenre"></small>
        <h2 id="endTitle"></h2>
        <p class="tl" id="endTag"></p>
      </div>
      <div style="width:100%">
        <div class="billing" id="endBill"></div>
        <div class="next" id="endNext"></div>
      </div>
    </div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="valance"></div>
    <div class="curtain-title">
      <small>SEEDANCE CINEMA LAB</small>
      <b>NOW<br>SHOWING</b>
      <span>포스터가 움직이는 순간,<br>당신의 예고편이 이 스크린에 걸립니다</span>
      <div class="scan"><span class="arr" aria-hidden="true">←</span><span>QR을 스캔하고 시작하세요</span></div>
      <div class="count">TRAILERS TODAY · <span id="count">0</span></div>
    </div>
  </div>
  <video id="pre" muted preload="auto" hidden></video>

  <script type="module">
    import { $, esc, pad, sleep, watchFeed, screenChrome, preload } from '/screen/screen.js';

    const chrome = screenChrome();
    // The QR stand sits to the left of the trailer screen; ?qr=right flips the arrow.
    const qrSide = new URLSearchParams(location.search).get('qr') === 'right' ? 'right' : 'left';
    document.body.classList.add(`qr-${qrSide}`);
    if (qrSide === 'right') $('.curtain-title .arr').textContent = '→';
    const PRE_MS = 4000, END_MS = 7000, MAX_VIDEO_MS = 40000;

    let items = [];          // newest first (live trailers)
    let known = null;
    const fresh = [];        // new submissions — they jump the rotation
    let rot = 0;
    let current = null;

    const hexRgb = (h) => { const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})/i.exec(h || ''); return m ? m.slice(1).map((x) => parseInt(x, 16)).join(',') : '212,255,58'; };
    const show = (id) => document.querySelectorAll('.scene').forEach((s) => s.classList.toggle('on', s.id === id));
    const alive = (it) => items.some((x) => x.id === it.id);

    function pick() {
      while (fresh.length) { const f = fresh.shift(); if (alive(f)) return f; }
      if (!items.length) return null;
      for (let i = 0; i < items.length; i++) {
        const it = items[rot++ % items.length];
        if (items.length === 1 || it.id !== current?.id) return it;
      }
      return items[0];
    }
    function peek() {
      const f = fresh.find(alive);
      if (f) return f;
      return items.length ? items[rot % items.length] : null;
    }

    function playVideo(src) {
      return new Promise((resolve) => {
        const v = $('#vid');
        let done = false;
        const finish = () => { if (done) return; done = true; clearTimeout(t); v.onended = v.onerror = v.ontimeupdate = null; resolve(); };
        const t = setTimeout(finish, MAX_VIDEO_MS);
        v.onended = finish;
        v.onerror = finish;
        v.ontimeupdate = () => { if (current && !alive(current)) { v.pause(); return finish(); } if (v.duration) $('#prog').style.width = `${(100 * v.currentTime) / v.duration}%`; };
        v.src = src;
        v.currentTime = 0;
        v.play().catch(() => setTimeout(finish, 3000));
      });
    }

    async function feature(it) {
      current = it;
      await preload(it.poster);
      // pre-show
      $('#preDir').textContent = it.director;
      $('#preSeed').textContent = `SEED NO.${pad(it.seed)}`;
      show('sPre');
      $('#hall').classList.remove('closed');
      await sleep(PRE_MS);
      // trailer
      $('#playTag').innerHTML = `<b style="--g:${esc(it.genre?.color || '')}">${esc(it.genre?.en || '')}</b>NO.${pad(it.seed)}`;
      $('#playDir').textContent = `${it.director} 감독`;
      $('#playLower').classList.remove('on');
      $('#prog').style.width = '0';
      show('sPlay');
      setTimeout(() => $('#playLower').classList.add('on'), 900);
      setTimeout(() => $('#playLower').classList.remove('on'), 5200);
      await playVideo(it.video);
      if (!alive(it)) return; // an operator hid it mid-show
      // end title card
      $('#sEnd').style.setProperty('--rgb', hexRgb(it.genre?.color));
      $('#endImg').src = it.poster;
      $('#endGenre').textContent = `${it.genre?.en || ''} · ${it.genre?.ko || ''}`;
      $('#endTitle').textContent = `〈${it.title}〉`;
      $('#endTag').textContent = it.tagline ? `“${it.tagline}”` : '';
      $('#endBill').innerHTML = `DIRECTED BY <b>${esc(it.director)}</b> &nbsp; SCREENPLAY BY <b>Seed</b><br>KEY ART BY <b>Seedream</b> &nbsp; MOTION BY <b>Seedance</b>`;
      const nx = peek();
      $('#endNext').innerHTML = nx && nx.id !== it.id ? `UP NEXT<b>〈${esc(nx.title)}〉 ${esc(nx.director)} 감독</b>` : 'COMING SOON';
      show('sEnd');
      // warm up the next trailer while the end card is up
      if (nx?.video) { $('#pre').src = nx.video; preload(nx.poster); }
      await sleep(END_MS);
    }

    (async function program() {
      for (;;) {
        const it = pick();
        if (!it) {
          current = null;
          $('#hall').classList.add('closed');
          await sleep(2000);
          continue;
        }
        await feature(it);
        // close the curtain between features when there is a premiere waiting
        if (fresh.some(alive)) { $('#hall').classList.add('closed'); await sleep(2600); }
        if (chrome.stale()) location.reload();
      }
    })();

    watchFeed('trailer', (list) => {
      if (known) for (const it of [...list].reverse()) if (!known.has(it.id)) fresh.push(it);
      known = new Set([...(known || []), ...list.map((x) => x.id)]);
      items = list;
      $('#count').textContent = items.length;
    });
  </script>
</body>
</html>
